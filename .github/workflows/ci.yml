name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Verify extension packages
        run: npx --yes @vscode/vsce package --out powerbuilder-intellisense.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: powerbuilder-intellisense.vsix
